<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lidd — Add medicine, already added, dark</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Lexend,sans-serif;color:#cdc7bb}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bdg{width:26px;height:26px;border-radius:8px;border:1px solid #7d7669;background:#1B1A18;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.grp{background:#262421;border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border-top:1px solid #3A3733;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;color:#cdc7bb;text-align:left}
.row:first-child{border-top:0}
.on{background:#2E3A31}
.sub{display:block;font-size:14px;color:#A39D92}
.q{margin:0 0 8px;font-size:16px;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;background:#1B1A18;display:flex;flex-direction:column;overflow:hidden">
<div style="padding:54px 8px 0;height:106px;display:flex;align-items:center;justify-content:space-between">
<span style="min-width:64px"></span>
<span style="font-size:15px;font-weight:500">Step 1 of 3</span>
<a href="AddDoneDark.dc.html" style="min-width:64px;height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:16px;color:#9bb9a1">Cancel</a>
</div>
<div style="padding:0 20px;display:flex;flex-direction:column;gap:18px">
<h1 style="margin:0;font-size:26px;font-weight:600">Add a medicine</h1>
<div>
<label for="nm" class="q" style="display:block">Name</label>
<input id="nm" value="Sumatriptan" style="width:100%;height:50px;border-radius:8px;background:#262421;border:1.5px solid #7FA187;padding:0 14px;font:16px Lexend,sans-serif;color:#cdc7bb">
<div style="margin-top:8px"><div style="display:flex;gap:10px;align-items:flex-start;background:#2e2820;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;color:#cdc7bb"><svg class="ic" style="color:#b07a3c;width:18px;height:18px;margin-top:2px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>You already have <b style="font-weight:600">Sumatriptan 50 mg tablet</b>. <a href="EditMed.dc.html" style="color:#9bb9a1;font-weight:500">Edit it instead</a></span></div></div>
</div>
<div>
<p class="q">What kind of medicine is it?</p>
<div class="grp">
<button class="row on" aria-pressed="true"><span class="bdg">T</span><span style="flex:1"><span style="display:block;font-size:16px;font-weight:600">Triptan</span><span class="sub">Name usually ends in “-triptan”</span></span><svg class="ic" style="color:#7fa187" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button>
<button class="row"><span class="bdg">C</span><span style="flex:1"><span style="display:block;font-size:16px">Combination</span><span class="sub">Two or more medicines in one tablet</span></span></button>
<button class="row"><span class="bdg">P</span><span style="flex:1"><span style="display:block;font-size:16px">Painkiller</span><span class="sub">Paracetamol, ibuprofen, naproxen, aspirin</span></span></button>
<button class="row"><span class="bdg">G</span><span style="flex:1"><span style="display:block;font-size:16px">Gepant</span><span class="sub">Name usually ends in “-gepant”</span></span></button>
<button class="row"><span class="bdg">?</span><span style="flex:1"><span style="display:block;font-size:16px">Not sure</span><span class="sub">Counted under “Any” until you choose</span></span></button>
</div>
<span class="sub" style="margin-top:6px">It's on the box or the leaflet. Decides which monthly guide it counts toward.</span>
</div>
</div>
<div style="margin-top:auto;padding:0 20px 34px">
<a href="AddFormDark.dc.html" style="height:52px;border-radius:12px;background:#7fa187;color:#1b1a18;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">Add another version</a>
</div>
</div>
</x-dc>
</body>
</html>
