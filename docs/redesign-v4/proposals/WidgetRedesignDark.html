<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lidd — Lock screen widget (redesign), dark</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Lexend,sans-serif;color:#cdc7bb}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sub{display:block;font-size:14px;color:#A39D92;line-height:1.45}
.lbl{display:block;font-size:15px;font-weight:600;color:#cdc7bb}
.card{background:#262421;border-radius:20px;padding:18px}
.grp{background:#262421;border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:12px 16px;border-top:1px solid #3A3733;color:#cdc7bb;font-size:16px}
.row:first-child{border-top:0}
.row .t{flex:1}
.val{font-size:16px;font-weight:600;color:#9bb9a1;text-align:right}
.add{font-size:16px;font-weight:500;color:#9bb9a1}
.btn{height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;border:0;padding:0 16px}
.pri{background:#7FA187;color:#1b1a18}
.sec{border:1px solid #7d7669;font-weight:500;background:none;color:#cdc7bb}
.hbtn{width:44px;height:44px;border-radius:22px;background:#262421;border:0;display:flex;align-items:center;justify-content:center;color:#cdc7bb;flex:none}
.sev{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:10px;font-size:16px;font-weight:600;color:#1b1a18;padding:0 6px;flex:none}
.s1{background:#b3ad9f}.s2{background:#c39257}.s3{background:#c68880}
.tab{position:absolute;left:0;right:0;bottom:0;height:88px;background:#1B1A18;border-top:1px solid #2b2926;display:flex;align-items:flex-start;justify-content:space-around;padding-top:10px}
.ti{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500;color:#A39D92;width:64px}
.ti.on{color:#9bb9a1}
.fab{width:60px;height:60px;border-radius:30px;background:#7FA187;color:#1b1a18;border:0;display:flex;align-items:center;justify-content:center;margin-top:-22px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;border-radius:18px;border:1px solid #3A3733;background:#262421;padding:0 14px;font-size:14px;font-weight:500;color:#cdc7bb}
.pill.on{background:#2E3A31;border-color:#7FA187;color:#9bb9a1}
.lnk{display:inline-flex;align-items:center;min-height:44px;border:0;background:none;padding:0 2px;color:#9bb9a1;font-size:16px;font-weight:500}
</style>
</helmet>

<div style="width:390px;height:844px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;position:relative">

<!-- Context: lock screen -->
<div style="text-align:center;color:#fff">
<span style="font-size:72px;font-weight:300;letter-spacing:-2px">21:34</span>
<span style="display:block;font-size:16px;margin-top:4px;opacity:.7">Saturday 21 November</span>
</div>

<!-- WIDGET: circular inline -->
<div style="display:flex;gap:20px;justify-content:center">
<div style="width:76px;height:76px;border-radius:38px;background:rgba(38,36,33,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid rgba(127,161,135,.3)">
<span style="font-size:22px;font-weight:600;color:#9bb9a1;line-height:1">7</span>
<span style="font-size:9px;font-weight:500;color:#A39D92;text-transform:uppercase;letter-spacing:.04em">attacks</span>
</div>
<div style="width:76px;height:76px;border-radius:38px;background:rgba(38,36,33,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid rgba(195,146,87,.3)">
<span style="font-size:22px;font-weight:600;color:#c9b58c;line-height:1">4<span style="font-size:14px;font-weight:400;color:#A39D92">/10</span></span>
<span style="font-size:9px;font-weight:500;color:#A39D92;text-transform:uppercase;letter-spacing:.04em">triptan</span>
</div>
</div>

<!-- WIDGET: rectangular (medium) -->
<div style="width:340px;background:rgba(38,36,33,.92);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(58,55,51,.6)">
<div style="display:flex;align-items:center;gap:8px">
<div style="width:20px;height:20px;border-radius:10px;background:#7FA187;display:flex;align-items:center;justify-content:center">
<svg style="width:12px;height:12px;fill:none;stroke:#1b1a18;stroke-width:2.5;stroke-linecap:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
</div>
<span style="font-size:13px;font-weight:600;color:#A39D92;text-transform:uppercase;letter-spacing:.04em">Lidd &middot; November</span>
</div>
<div style="display:flex;gap:16px">
<div style="flex:1;display:flex;flex-direction:column;gap:4px">
<span style="font-size:28px;font-weight:600;color:#e4dfd4;line-height:1">7</span>
<span style="font-size:13px;color:#A39D92">attack days</span>
<span style="font-size:12px;color:#7FA187">&darr; from 9</span>
</div>
<div style="width:1px;background:#3A3733"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:4px">
<span style="font-size:28px;font-weight:600;color:#e4dfd4;line-height:1">4<span style="font-size:16px;color:#A39D92">/10</span></span>
<span style="font-size:13px;color:#A39D92">triptan days</span>
</div>
<div style="width:1px;background:#3A3733"></div>
<div style="flex:1;display:flex;flex-direction:column;gap:4px">
<span style="font-size:28px;font-weight:600;color:#e4dfd4;line-height:1">2</span>
<span style="font-size:13px;color:#A39D92">days since</span>
</div>
</div>
</div>

<!-- WIDGET: rectangular (small, home screen style) -->
<div style="display:flex;gap:16px;justify-content:center">
<div style="width:160px;height:160px;background:rgba(38,36,33,.92);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(58,55,51,.6)">
<div style="display:flex;align-items:center;gap:6px">
<div style="width:16px;height:16px;border-radius:8px;background:#7FA187;display:flex;align-items:center;justify-content:center">
<svg style="width:10px;height:10px;fill:none;stroke:#1b1a18;stroke-width:3;stroke-linecap:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
</div>
<span style="font-size:11px;font-weight:600;color:#A39D92;text-transform:uppercase;letter-spacing:.03em">Lidd</span>
</div>
<div>
<span style="font-size:38px;font-weight:600;color:#e4dfd4;line-height:1">7</span>
<span style="display:block;font-size:14px;color:#A39D92;margin-top:2px">attack days</span>
<span style="display:block;font-size:12px;color:#7FA187">&darr; from 9 last month</span>
</div>
</div>
<div style="width:160px;height:160px;background:rgba(38,36,33,.92);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(58,55,51,.6)">
<div style="display:flex;align-items:center;gap:6px">
<div style="width:16px;height:16px;border-radius:8px;background:#c9b58c;display:flex;align-items:center;justify-content:center">
<svg style="width:10px;height:10px;fill:none;stroke:#1b1a18;stroke-width:3;stroke-linecap:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
</div>
<span style="font-size:11px;font-weight:600;color:#A39D92;text-transform:uppercase;letter-spacing:.03em">Triptan</span>
</div>
<div>
<span style="font-size:38px;font-weight:600;color:#e4dfd4;line-height:1">4<span style="font-size:20px;color:#A39D92">/10</span></span>
<span style="display:block;font-size:14px;color:#A39D92;margin-top:2px">days this month</span>
<span style="display:block;font-size:12px;color:#c9b58c">6 remaining</span>
</div>
</div>
</div>

<span class="sub" style="text-align:center;font-size:12px;max-width:300px;opacity:.5">Top: lock screen circular. Middle: lock screen rectangular. Bottom: home screen small.</span>
</div>

</x-dc>
</body>
</html>
